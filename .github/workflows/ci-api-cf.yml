name: CI — api-cf

on:
  pull_request:
    paths:
      - 'apps/api-cf/**'
      - 'package-lock.json'
      - '.github/workflows/ci-api-cf.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api-cf/**'
      - '.github/workflows/ci-api-cf.yml'
  # Deploys are manual only (production is gated on this event).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx nx typecheck api-cf

      - name: Test (workerd + D1 via Miniflare)
        run: npx nx test api-cf

  deploy:
    name: Deploy to Cloudflare (production)
    runs-on: ubuntu-latest
    needs: verify
    # Manual promotion only — never auto-deploys on merge.
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote)
        working-directory: apps/api-cf
        run: npx wrangler d1 migrations apply signchain --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: apps/api-cf
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
